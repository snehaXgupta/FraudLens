<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" /> <!-- Violet/Purple -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan -->
    </linearGradient>
    
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Scanning Tech Ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#cyber-gradient)" stroke-width="2" stroke-dasharray="10 15" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
  </circle>

  <!-- Mid Segmented Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#cyber-gradient)" stroke-width="3" stroke-dasharray="40 10 10 10" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite" />
  </circle>

  <!-- Eye Shape Outline -->
  <path d="M 30,100 C 60,50 140,50 170,100 C 140,150 60,150 30,100 Z" fill="none" stroke="url(#cyber-gradient)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Iris Ring -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="url(#cyber-gradient)" stroke-width="2.5" />
  
  <!-- Scanning Lens / Target grid (Vertical & Horizontal crosses inside Iris) -->
  <line x1="100" y1="75" x2="100" y2="125" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="75" y1="100" x2="125" y2="100" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Pupil (Central glowing dot) -->
  <circle cx="100" cy="100" r="15" fill="url(#cyber-gradient)" filter="url(#glow)">
    <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Scan line moving vertically -->
  <line x1="40" y1="65" x2="160" y2="65" stroke="#22c55e" stroke-width="2" opacity="0.8" filter="url(#glow)">
    <animate attributeName="y1" values="65;135;65" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="65;135;65" dur="4s" repeatCount="indefinite" />
  </line>
</svg>
